<style>
/* «وِجهة» — Apple-style glass (iOS / macOS materials) */
:root{
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
 --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
 --blue:#007AFF;--acc:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--yellow:#FFCC00;
 --bg:#F2F2F7;--fg:#1C1C1E;--muted:#6E6E73;--dim:#8E8E93;--sep:rgba(60,60,67,.14);
 --mat:rgba(255,255,255,.72);--matb:rgba(255,255,255,.7);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.08);
 --card:rgba(255,255,255,.78);--row:#FFFFFF;--rowh:#FFFFFF;--input:rgba(118,118,128,.12);--sheet:rgba(255,255,255,.94);
 --blur:saturate(180%) blur(24px);--sh:0 1px 0 rgba(255,255,255,.6) inset,0 8px 30px rgba(0,0,0,.06);--sh2:0 2px 10px rgba(0,0,0,.05);
 --r:22px;--sw:260px;color-scheme:light}
:root[data-theme="dark"]{
 --blue:#0A84FF;--acc:#0A84FF;--green:#30D158;--orange:#FF9F0A;--red:#FF453A;--yellow:#FFD60A;
 --bg:#000000;--fg:#F5F5F7;--muted:#AEAEB2;--dim:#8E8E93;--sep:rgba(84,84,88,.45);
 --mat:rgba(30,30,32,.62);--matb:rgba(255,255,255,.09);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.16);
 --card:rgba(28,28,30,.66);--row:rgba(44,44,46,.72);--rowh:rgba(58,58,60,.85);--input:rgba(118,118,128,.24);--sheet:rgba(28,28,30,.96);
 --sh:0 1px 0 rgba(255,255,255,.06) inset,0 10px 34px rgba(0,0,0,.45);--sh2:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}
@media(min-width:1280px){:root{--sw:280px}}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;direction:rtl;background:transparent;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid rgba(0,122,255,.55);outline-offset:2px}
.tab-num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
/* wallpaper: soft colour fields like a macOS desktop */
.bgdeco{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
.bgdeco i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.bgdeco .b1{width:620px;height:620px;top:-220px;right:-140px;background:#5AC8FA}
.bgdeco .b2{width:560px;height:560px;top:30%;left:-220px;background:#5E5CE6;opacity:.38}
.bgdeco .b3{width:520px;height:520px;bottom:-240px;right:22%;background:#FF9F0A;opacity:.22}
:root[data-theme="dark"] .bgdeco i{opacity:.32}
:root[data-theme="dark"] .bgdeco .b3{opacity:.14}
/* materials */
.card,.side,.hd,.tabbar,.sbar.big,.ibtn,.scard,.qgrid,.dcard,.k4>div,.sc,.box,.toast,.sbar:not(.big) .search{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.card{background:var(--card);border:1px solid var(--matb);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.card h3{margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h3 small{font-family:var(--font);font-weight:400;font-size:12.5px;color:var(--dim)}
/* brand */
.mark{width:42px;height:42px;flex:none;display:block;filter:drop-shadow(0 4px 10px rgba(10,132,255,.35))}
.bt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.bt b{font-family:var(--display);font-weight:800;font-size:20px}
.bt span{font-size:12px;color:var(--muted);margin-top:3px}
/* layout */
.app{max-width:620px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;min-height:100vh}
.app>*{min-width:0;max-width:100%}
.hd{position:sticky;top:8px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 10px;border-radius:20px;background:var(--mat);border:1px solid var(--matb);box-shadow:var(--sh2)}
.hd .id{display:flex;align-items:center;gap:10px;min-width:0}
.hd .mark{width:38px;height:38px}
.hd .bt b{font-size:18px}
.hd .acts{display:flex;gap:6px;flex:none}
.ibtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--fill);color:var(--blue);display:grid;place-items:center;padding:0;flex:none;text-decoration:none}
.ibtn svg{width:20px;height:20px}
.ibtn.on{background:var(--blue);color:#fff}
/* bottom tab bar (iOS) */
.tabbar{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));display:flex;gap:2px;padding:6px;border-radius:26px;background:var(--mat);border:1px solid var(--matb);box-shadow:0 12px 40px rgba(0,0,0,.18)}
.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;border:0;border-radius:20px;background:transparent;color:var(--dim);font-size:10.5px;font-weight:600}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-pressed="true"]{color:var(--blue);background:var(--fill2)}
/* hero + search */
.sbar{display:flex;flex-direction:column;gap:14px}
.sbar.big{padding:26px 22px 22px;border-radius:28px;background:var(--mat);border:1px solid var(--matb);box-shadow:var(--sh)}
.gr{display:flex;flex-direction:column;gap:8px}
.pill2{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;background:var(--fill2);font-size:12.5px;color:var(--muted);font-weight:500}
.pill2 i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.gr h1{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.3}
.gr h1 #greet{background:linear-gradient(90deg,#0A84FF,#5E5CE6);-webkit-background-clip:text;background-clip:text;color:transparent}
.gr p{margin:0;color:var(--muted);font-size:15px}
.srow{display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:16px;background:var(--input);border:0}
.sbar:not(.big) .search{background:var(--mat);border:1px solid var(--matb);box-shadow:var(--sh2)}
.search svg{width:20px;height:20px;color:var(--dim);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;height:100%;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--dim)}
.search:focus-within{box-shadow:0 0 0 3.5px rgba(0,122,255,.3)}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:50px;padding:0 18px;border-radius:16px;border:0;background:var(--fill);color:var(--blue);font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none}
.gbtn svg{width:19px;height:19px}
.gbtn:hover{background:var(--fill2)}
.gbtn.acc{background:var(--blue);color:#fff}
.gbtn.sm{height:36px;padding:0 14px;border-radius:11px;font-size:14px}
.gbtn.sm svg{width:16px;height:16px}
/* blocks */
.block{display:flex;flex-direction:column;gap:12px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.bh h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.bh>span{color:var(--dim);font-size:13px}
.lnk{border:0;background:none;color:var(--blue);font-weight:500;padding:0;font-size:15px;text-decoration:none}
/* quick access — home-screen app icons */
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 10px;padding:18px 12px;border-radius:26px;background:var(--card);border:1px solid var(--matb);box-shadow:var(--sh)}
.qgrid.sm{padding:14px 12px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;min-width:0;text-align:center}
.qi{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 85%,#000));box-shadow:0 6px 14px color-mix(in srgb,var(--c) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .18s}
.qi svg{width:30px;height:30px}
.qa:hover .qi{transform:translateY(-2px) scale(1.04)}
.qa:active .qi{transform:scale(.94)}
.qa b{font-size:12px;font-weight:500;line-height:1.3;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qgrid.sm .qi{width:50px;height:50px;border-radius:13px}.qgrid.sm .qi svg{width:25px;height:25px}
/* section cards on home */
.scards{display:grid;grid-template-columns:1fr;gap:14px}
.scard{border-radius:var(--r);background:var(--card);border:1px solid var(--matb);box-shadow:var(--sh);overflow:hidden;min-width:0}
.sch{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:transparent;text-align:start}
.si{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c) 60%)}
.si svg{width:20px;height:20px}
.si.big{width:44px;height:44px;border-radius:12px}.si.big svg{width:26px;height:26px}
.st{flex:1;min-width:0;display:flex;flex-direction:column}
.st b{font-family:var(--display);font-weight:700;font-size:17px}
.st small{color:var(--dim);font-size:12.5px}
.sa{color:var(--blue);font-size:14px;font-weight:500;white-space:nowrap}
.ml{display:flex;flex-direction:column;padding:0 0 6px}
.mr{display:flex;align-items:center;gap:12px;padding:9px 16px;text-decoration:none;position:relative;min-width:0}
.mr::before{content:"";position:absolute;top:0;left:16px;right:58px;height:1px;background:var(--sep)}
.mr:hover{background:var(--fill2)}
.mi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c) 60%)}
.mi svg{width:17px;height:17px}
.mt{flex:1;min-width:0;display:flex;flex-direction:column}
.mt b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt small{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ma{color:var(--dim);opacity:.7}.ma svg{width:15px;height:15px;display:block}
/* health days strip */
.dstrip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dstrip::-webkit-scrollbar{display:none}
.dcard{flex:0 0 220px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--matb);box-shadow:var(--sh);text-align:start;min-height:150px}
.dcard>b{font-weight:600;font-size:14.5px;line-height:1.4;flex:1}
.dbad{width:48px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;background:var(--row);box-shadow:var(--sh2);line-height:1;overflow:hidden;position:relative;padding-top:10px}
.dbad::before{content:"";position:absolute;top:0;left:0;right:0;height:13px;background:var(--red)}
.dbad b{font-family:var(--display);font-weight:700;font-size:21px}
.dbad small{font-size:9.5px;color:var(--dim);margin-top:3px}
.cd2{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;background:var(--fill);color:var(--muted)}
.cd2.now{background:rgba(52,199,89,.18);color:var(--green)}
.cd2.soon{background:rgba(255,149,0,.16);color:var(--orange)}
/* page heads & section chips */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 4px}
.sh h2{margin:0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.2;display:flex;align-items:center;gap:12px}
.sh p{margin:4px 0 0;color:var(--muted);font-size:14px}
.sh .acts{display:flex;gap:8px;flex-wrap:wrap}
.schips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.schips::-webkit-scrollbar{display:none}
.sc{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:99px;border:1px solid var(--matb);background:var(--mat);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.sc .si{width:28px;height:28px;border-radius:50%}.sc .si svg{width:16px;height:16px}
.sc em{font-style:normal;color:var(--dim);font-size:12px;font-weight:500}
.sc[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.sc[aria-pressed="true"] em{color:rgba(255,255,255,.8)}
.sc[aria-pressed="true"] .si{background:rgba(255,255,255,.25)}
/* link rows */
.lgrid{display:grid;grid-template-columns:1fr;gap:10px}
.lk{position:relative;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 8px;border-radius:18px;background:var(--row);box-shadow:var(--sh2);min-width:0;transition:transform .15s,background .15s}
.lk:hover{background:var(--rowh);transform:translateY(-1px)}
.lk .ic{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 85%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.lk .ic svg{width:25px;height:25px}
.lk .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-decoration:none}
.lk .tx b{font-weight:600;font-size:15.5px;line-height:1.35}
.lk .tx small{color:var(--muted);font-size:13px;line-height:1.45}
.lk .tx em{font-style:normal;color:var(--dim);font-size:11.5px;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--dim);display:grid;place-items:center;font-size:19px;line-height:1;flex:none;padding:0}
.star:hover{background:var(--fill2)}
.star[aria-pressed="true"]{color:var(--yellow)}
.lk .stores{display:flex;gap:6px;flex:none}
.lk .stores a{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:99px;background:var(--fill);color:var(--blue);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.lk .stores svg{width:14px;height:14px}
.lk .pen{display:none;font-size:12px;font-weight:600;color:var(--blue);background:var(--fill);border-radius:99px;padding:2px 10px;flex:none}
body.editing .lk .pen{display:inline-block}
body.editing .lk{cursor:pointer;outline:1.5px dashed rgba(0,122,255,.45)}
body.editing .lk .star{display:none}
.grp{display:flex;flex-direction:column;gap:10px}
.gh{display:flex;align-items:center;gap:10px;padding:0 4px;border:0;background:transparent;text-align:start;width:100%}
.gh b{font-family:var(--display);font-weight:700;font-size:19px}
.gh>span{color:var(--dim);font-size:13px}
.gh .sp{flex:1}
body:not(.editing) .ed-only{display:none!important}
/* days */
.dlist{display:flex;flex-direction:column}
.dr{display:flex;align-items:center;gap:12px;padding:9px 2px;min-width:0;border-bottom:1px solid var(--sep)}
.dr:last-child{border-bottom:0}
.dr .xt{flex:1;min-width:0;font-weight:500;font-size:15px;line-height:1.4}
.dr .xt small{display:block;color:var(--dim);font-size:12px}
body.editing .dr{cursor:pointer}
.mgrid{display:grid;grid-template-columns:1fr;gap:14px}
.mon h3 .sw{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block}
.mon.cur{box-shadow:var(--sh),0 0 0 2px var(--blue)}
.gcal iframe{width:100%;height:480px;border:0;border-radius:14px;background:#fff;display:block}
/* section folders (App Library) */
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fold{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:14px;border-radius:24px;border:1px solid var(--matb);background:var(--card);box-shadow:var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);text-align:start;min-width:0;transition:transform .15s}
.fold:hover{transform:translateY(-2px)}
.fold:active{transform:scale(.97)}
.f4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.fi{aspect-ratio:1;border-radius:24%;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 85%,#000));box-shadow:0 3px 8px color-mix(in srgb,var(--c) 28%,transparent)}
.fi svg{width:52%;height:52%}
.fi.e{background:var(--fill2);box-shadow:none}
.fn{display:flex;align-items:center;gap:8px;min-width:0}
.fn .si{width:26px;height:26px;border-radius:7px}.fn .si svg{width:15px;height:15px}
.fn b{font-family:var(--display);font-weight:700;font-size:15.5px;line-height:1.3;min-width:0}
.fold small{color:var(--dim);font-size:12.5px;margin-top:-6px;padding-right:34px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--blue);font-size:17px;font-weight:500;padding:4px 2px;margin-bottom:-12px}
.back svg{width:22px;height:22px}
@media(min-width:740px){.lib{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1280px){.lib{grid-template-columns:repeat(6,minmax(0,1fr))}}
/* install tip */
.tip{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 10px;border-radius:20px;background:var(--card);border:1px solid var(--matb);box-shadow:var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.tipi .mark{width:44px;height:44px}
.tipt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tipt b{font-weight:700;font-size:15px}
.tipt span{color:var(--muted);font-size:13px;line-height:1.5}
.tipx{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--dim);display:grid;place-items:center;padding:0;font-size:13px;flex:none}
/* misc */
.empty2{border-radius:var(--r);background:var(--card);padding:36px 18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty2 b{font-family:var(--display);color:var(--fg);font-size:18px}

  if(op==='update'&&i>=0)Object.assign(arr[i],data);

  else if(op==='delete'){if(i>=0)arr.splice(i,1);if(c==='sections')S.links=S.links.filter(l=>l.sid!==id)}
  render();
  if(!S.db||S.readonly){toast('سجّل الدخول لحفظ التغييرات');return Promise.resolve()}
  if(data)data.updatedAt=Date.now();
  saveN++;setSave('saving');
  chain=chain.then(()=>S.db.send({c,id,op,data})).then(()=>{if(--saveN<=0){saveN=0;setSave('saved')}}).catch(e=>{saveN=Math.max(0,saveN-1);setSave('failed');toast(e&&e.code==='permission_denied'?'انتهت صلاحية الدخول، ادخل مرة ثانية':e&&e.code==='bad url'?'الرابط لازم يبدأ بـ https://':'تعذّر الحفظ، حاول مرة أخرى')});
  return chain;
}

    const {secs,label,days}=scopeData(sc);const wb=new ExcelJS.Workbook();wb.creator='سالم سعد الشهري';
    const BG='FF1C1C1E',PN='FF2C2C2E',ALT='FF242426',FG='FFFFFFFF',MU='FF98989F',AC='FF0A84FF';

    const sheet=(n,cols)=>{const ws=wb.addWorksheet(n,{views:[{rightToLeft:true,showGridLines:false}]});ws.columns=cols.map(w=>({width:w}));return ws};
    const paint=(ws,rows,cols)=>{for(let r=1;r<=rows;r++)for(let c=1;c<=cols;c++){const cell=ws.getCell(r,c);if(!cell.fill)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:BG}};if(!cell.font)cell.font=font()}};
    const title=(ws,t,cols)=>{ws.mergeCells(1,1,1,cols);const c=ws.getCell(1,1);c.value=t;c.font=font({size:18,bold:true});ws.getRow(1).height=34;c.alignment={horizontal:'right',vertical:'middle'};

  }}
async function useSnapshot(){try{const s=await (await fetch('/seed.json',{cache:'no-store'})).json();const m=o=>Object.entries(o||{}).map(([id,d])=>({id,...d}));S.sec=m(s.sections);S.links=m(s.links);S.days=m(s.days)}catch(e){}
  S.loaded=true;S.readonly=true;S.sync={ok:false,at:Date.now()};render()}
async function start(){
  const db=apiDb();S.db=db;render();
  try{await db.pull()}catch(e){await useSnapshot();return}
  S.readonly=!API.pin;render();
  if(API.pin){let seen=false;try{seen=sessionStorage.getItem('thc-links-sess')==='1'}catch(e){}
    if(!seen)db.ping(API.pin,API.name,true).then(r=>{if(!r||r.error){setEdit(false);return}try{sessionStorage.setItem('thc-links-sess','1')}catch(e){}if(r.role!==API.role){API.role=r.role;saveApi();render()}}).catch(()=>{})}
  setInterval(()=>{if(document.visibilityState==='visible')db.pull().catch(()=>{S.sync={ok:false,at:Date.now()};if(!document.querySelector('.modal'))render()})},30000);
}
start();
})();
</script>
